services:

  db:
    image: mysql:8.0
    container_name: address-book-db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: addressbook
      MYSQL_USER: app
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql


  app:
    build: .
    container_name: address-book-app

    working_dir: /app

    depends_on:
      - db

    ports:
      - "8080:8080"

    volumes:
      - .:/app
      - maven-cache:/root/.m2

    command: sh -c "chmod +x mvnw && ./mvnw spring-boot:run"


  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: address-book-phpmyadmin

    restart: unless-stopped

    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root

    ports:
      - "8081:80"

    depends_on:
      - db


volumes:
  mysql-data:
  maven-cache: